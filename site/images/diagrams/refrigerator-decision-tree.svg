<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Refrigerated food decision tree after a power outage</title><desc id="d">A decision tree uses outage length, 40 degree temperature, cooler transfer, and uncertainty.</desc><rect width="1200" height="800" fill="white"/><g font-family="Arial, sans-serif" stroke="black" stroke-width="3" fill="none"><rect x="390" y="40" width="420" height="80" rx="16"/><text x="600" y="88" text-anchor="middle" fill="black" font-size="26">Refrigerated perishable food</text><line x1="600" y1="120" x2="600" y2="175"/><rect x="390" y="175" width="420" height="90" rx="16"/><text x="600" y="215" text-anchor="middle" fill="black" font-size="24">Outage 4 hours or less</text><text x="600" y="245" text-anchor="middle" fill="black" font-size="18">and door stayed closed?</text><line x1="390" y1="220" x2="210" y2="220"/><text x="310" y="205" fill="black" font-size="18">Yes</text><rect x="40" y="175" width="280" height="110" rx="16"/><text x="180" y="220" text-anchor="middle" fill="black" font-size="24">Generally keep</text><text x="180" y="255" text-anchor="middle" fill="black" font-size="17">unless another issue exists</text><line x1="810" y1="220" x2="990" y2="220"/><text x="880" y="165" text-anchor="end" fill="black" font-size="18">No / unknown</text><rect x="900" y="175" width="280" height="110" rx="16"/><text x="1040" y="215" text-anchor="middle" fill="black" font-size="22">Kept at 40°F or below?</text><text x="1040" y="250" text-anchor="middle" fill="black" font-size="17">Cooler or verified appliance</text><line x1="1040" y1="285" x2="1040" y2="355"/><rect x="900" y="355" width="280" height="110" rx="16"/><text x="1040" y="397" text-anchor="middle" fill="black" font-size="22">Yes: keep cold</text><text x="1040" y="435" text-anchor="middle" fill="black" font-size="17">continue monitoring</text><line x1="900" y1="410" x2="700" y2="410"/><text x="805" y="395" fill="black" font-size="18">No / unknown</text><rect x="390" y="355" width="380" height="110" rx="16"/><text x="580" y="397" text-anchor="middle" fill="black" font-size="22">Above 40°F over 2 hours?</text><text x="580" y="435" text-anchor="middle" fill="black" font-size="17">or time cannot be determined?</text><line x1="580" y1="465" x2="580" y2="540"/><rect x="390" y="540" width="380" height="100" rx="16"/><text x="580" y="585" text-anchor="middle" fill="black" font-size="30">Discard</text><text x="580" y="617" text-anchor="middle" fill="black" font-size="18">Do not taste</text><text x="600" y="730" text-anchor="middle" fill="black" font-size="18">When time or temperature is unknown, use the conservative discard decision.</text></g></svg>