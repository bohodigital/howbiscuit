<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Wi-Fi extender placement</title><desc id="d">A good example shows an extender before the dead zone with a useful router link and client link. A poor example places it inside the dead zone.</desc><rect width="1200" height="650" fill="white"/><g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none"><text x="600" y="55" text-anchor="middle" fill="black" font-size="30">An extender needs a useful upstream link</text><text x="300" y="115" text-anchor="middle" fill="black" font-size="24">Better</text><rect x="60" y="200" width="150" height="90" rx="14"/><text x="135" y="253" text-anchor="middle" fill="black" font-size="21">Router</text><rect x="335" y="200" width="170" height="90" rx="14"/><text x="420" y="253" text-anchor="middle" fill="black" font-size="21">Extender</text><rect x="680" y="200" width="150" height="90" rx="14"/><text x="755" y="253" text-anchor="middle" fill="black" font-size="21">Client</text><line x1="210" y1="245" x2="335" y2="245"/><line x1="505" y1="245" x2="680" y2="245"/><text x="273" y="225" text-anchor="middle" fill="black" font-size="17">good upstream</text><text x="592" y="225" text-anchor="middle" fill="black" font-size="17">client link</text><rect x="870" y="165" width="110" height="160" rx="15"/><text x="925" y="250" text-anchor="middle" fill="black" font-size="17" transform="rotate(-90 925 250)">dead-zone edge</text><text x="300" y="390" text-anchor="middle" fill="black" font-size="24">Poor</text><rect x="60" y="455" width="150" height="90" rx="14"/><text x="135" y="508" text-anchor="middle" fill="black" font-size="21">Router</text><rect x="600" y="455" width="170" height="90" rx="14"/><text x="685" y="508" text-anchor="middle" fill="black" font-size="21">Extender</text><rect x="920" y="455" width="150" height="90" rx="14"/><text x="995" y="508" text-anchor="middle" fill="black" font-size="21">Client</text><line x1="210" y1="500" x2="600" y2="500" stroke-dasharray="7 11"/><line x1="770" y1="500" x2="920" y2="500"/><text x="405" y="480" text-anchor="middle" fill="black" font-size="17">weak upstream</text><text x="845" y="480" text-anchor="middle" fill="black" font-size="17">strong icon, poor path</text><text x="600" y="610" text-anchor="middle" fill="black" font-size="18">“Halfway” is a starting point. Verify router-link quality and real performance.</text></g></svg>