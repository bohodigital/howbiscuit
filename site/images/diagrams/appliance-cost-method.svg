<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t d">
<title id="t">Choose an appliance electricity cost method</title>
<desc id="d">A decision chart prioritizes annual kilowatt-hours, safe measured kilowatt-hours, per-cycle data, and watts multiplied by time.</desc>
<rect width="1200" height="780" fill="white"/>
<g font-family="Arial, sans-serif" stroke="black" stroke-width="3" fill="none">
<rect x="350" y="35" width="500" height="80" rx="16"/><text x="600" y="82" text-anchor="middle" fill="black" font-size="28">What energy information do you have?</text>
<line x1="600" y1="115" x2="600" y2="165"/>
<rect x="375" y="165" width="450" height="80" rx="16"/><text x="600" y="212" text-anchor="middle" fill="black" font-size="24">Model-specific annual kWh?</text>
<line x1="375" y1="205" x2="215" y2="205"/><text x="300" y="190" fill="black" font-size="18">Yes</text>
<rect x="35" y="155" width="290" height="115" rx="16"/><text x="180" y="195" text-anchor="middle" fill="black" font-size="22">Use annual kWh</text><text x="180" y="230" text-anchor="middle" fill="black" font-size="17">Multiply by local $/kWh</text>
<line x1="600" y1="245" x2="600" y2="315"/><text x="620" y="285" fill="black" font-size="18">No</text>
<rect x="375" y="315" width="450" height="95" rx="16"/><text x="600" y="352" text-anchor="middle" fill="black" font-size="22">Safe compatible kWh measurement</text><text x="600" y="382" text-anchor="middle" fill="black" font-size="17">or utility interval data?</text>
<line x1="375" y1="362" x2="215" y2="362"/><text x="300" y="347" fill="black" font-size="18">Yes</text>
<rect x="35" y="312" width="290" height="110" rx="16"/><text x="180" y="352" text-anchor="middle" fill="black" font-size="22">Use measured kWh</text><text x="180" y="387" text-anchor="middle" fill="black" font-size="17">Match a representative period</text>
<line x1="600" y1="410" x2="600" y2="480"/><text x="620" y="450" fill="black" font-size="18">No</text>
<rect x="375" y="480" width="450" height="95" rx="16"/><text x="600" y="517" text-anchor="middle" fill="black" font-size="22">Annual kWh and annual cycles?</text><text x="600" y="547" text-anchor="middle" fill="black" font-size="17">Use standardized cycle assumptions carefully</text>
<line x1="825" y1="527" x2="985" y2="527"/><text x="875" y="512" fill="black" font-size="18">Yes</text>
<rect x="875" y="475" width="290" height="110" rx="16"/><text x="1020" y="515" text-anchor="middle" fill="black" font-size="22">Calculate per cycle</text><text x="1020" y="550" text-anchor="middle" fill="black" font-size="17">Annual kWh / cycles x rate</text>
<line x1="600" y1="575" x2="600" y2="645"/><text x="620" y="615" fill="black" font-size="18">No</text>
<rect x="375" y="645" width="450" height="90" rx="16"/><text x="600" y="680" text-anchor="middle" fill="black" font-size="22">Use watts x time as a rough estimate</text><text x="600" y="710" text-anchor="middle" fill="black" font-size="17">State cycling, power-factor, and rating caveats</text>
</g></svg>