<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Appliance cost calculation methods</title><desc id="d">Watts and time, measured kilowatt-hours, and annual kilowatt-hours lead to a cost calculation using the electricity rate.</desc><rect width="1200" height="650" fill="white"/><g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none"><text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Choose the strongest input you have</text><rect x="65" y="125" width="300" height="180" rx="18"/><text x="215" y="185" text-anchor="middle" fill="black" font-size="24">Watts and time</text><text x="215" y="230" text-anchor="middle" fill="black" font-size="18">Input power and runtime</text><rect x="450" y="125" width="300" height="180" rx="18"/><text x="600" y="185" text-anchor="middle" fill="black" font-size="24">Measured kWh</text><text x="600" y="230" text-anchor="middle" fill="black" font-size="18">Representative complete use</text><rect x="835" y="125" width="300" height="180" rx="18"/><text x="985" y="185" text-anchor="middle" fill="black" font-size="24">Annual kWh</text><text x="985" y="230" text-anchor="middle" fill="black" font-size="18">EnergyGuide or certified data</text><line x1="215" y1="305" x2="500" y2="420"/><line x1="600" y1="305" x2="600" y2="410"/><line x1="985" y1="305" x2="700" y2="420"/><rect x="400" y="410" width="400" height="110" rx="18"/><text x="600" y="455" text-anchor="middle" fill="black" font-size="25">Energy × price per kWh</text><text x="600" y="490" text-anchor="middle" fill="black" font-size="19">Estimated electricity cost</text><text x="600" y="590" text-anchor="middle" fill="black" font-size="18">Use the reader’s utility rate when available.</text></g></svg>