<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t desc">
<title id="t">Stored and delivered hot-water temperatures</title>
<desc id="desc">A storage tank may hold one temperature while a mixing valve blends cold water to a lower delivered tap temperature.</desc>
<rect width="1200" height="700" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">

<text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Storage temperature and tap temperature can differ</text>
<rect x="90" y="190" width="280" height="300" rx="28"/><text x="230" y="250" text-anchor="middle" fill="black" font-size="25">Storage tank</text><text x="230" y="315" text-anchor="middle" fill="black" font-size="38">Stored hot water</text>
<line x1="370" y1="340" x2="520" y2="340"/><text x="445" y="315" text-anchor="middle" fill="black" font-size="18">hot</text>
<line x1="600" y1="150" x2="600" y2="280"/><text x="630" y="205" fill="black" font-size="18">cold</text>
<circle cx="600" cy="340" r="70"/><text x="600" y="332" text-anchor="middle" fill="black" font-size="20">Mixing</text><text x="600" y="360" text-anchor="middle" fill="black" font-size="20">valve</text>
<line x1="670" y1="340" x2="850" y2="340"/>
<rect x="850" y="270" width="250" height="140" rx="20"/><text x="975" y="325" text-anchor="middle" fill="black" font-size="24">Delivered tap</text><text x="975" y="365" text-anchor="middle" fill="black" font-size="30">about 120°F</text>
<text x="600" y="575" text-anchor="middle" fill="black" font-size="18">Higher storage temperatures require professional anti-scald design.</text>

</g></svg>