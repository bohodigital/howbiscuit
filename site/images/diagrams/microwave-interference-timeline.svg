<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t desc">
<title id="t">Illustrative microwave and Wi-Fi interference timeline</title>
<desc id="desc">A timeline compares a 2.4 gigahertz latency line that spikes while the microwave is running with a steadier 5 gigahertz line.</desc>
<rect width="1200" height="680" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">
<text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Look for a repeatable on-and-off pattern</text>
<line x1="100" y1="510" x2="1100" y2="510"/><line x1="100" y1="510" x2="100" y2="130"/>
<text x="600" y="565" text-anchor="middle" fill="black" font-size="19">Time</text>
<text x="38" y="320" text-anchor="middle" fill="black" font-size="19" transform="rotate(-90 38 320)">Latency or disruption</text>
<rect x="430" y="120" width="310" height="390" stroke-dasharray="10 8"/>
<text x="585" y="105" text-anchor="middle" fill="black" font-size="20">Microwave operating normally</text>
<path d="M100 435 L260 430 L410 438 L450 330 L500 220 L550 340 L600 180 L650 310 L700 225 L740 430 L900 435 L1100 430" stroke-width="5"/>
<path d="M100 465 L300 460 L500 462 L700 457 L900 463 L1100 460" stroke-width="5" stroke-dasharray="12 8"/>
<text x="960" y="410" fill="black" font-size="18">2.4 GHz example</text>
<text x="960" y="485" fill="black" font-size="18">5 GHz comparison</text>
<text x="600" y="610" text-anchor="middle" fill="black" font-size="18">Illustrative only. Repeat the same test before, during, and after normal microwave use.</text>
<text x="600" y="646" text-anchor="middle" fill="black" font-size="18">This is not a microwave leakage or safety measurement.</text>
</g></svg>