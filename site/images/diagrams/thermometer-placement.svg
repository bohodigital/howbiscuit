<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Refrigerator and freezer thermometer placement</title><desc id="d">One appliance thermometer in the refrigerator and one in the freezer, with the refrigerator glass-of-water test and freezer between-package test.</desc><rect width="1200" height="720" fill="white"/><g font-family="Arial, sans-serif" stroke="black" stroke-width="3" fill="none"><text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Use one appliance thermometer in each compartment</text><rect x="90" y="105" width="450" height="480" rx="24"/><text x="315" y="165" text-anchor="middle" fill="black" font-size="28">Freezer</text><text x="315" y="210" text-anchor="middle" fill="black" font-size="22">Normal target: 0°F or below</text><rect x="200" y="330" width="230" height="75" rx="10"/><text x="315" y="375" text-anchor="middle" fill="black" font-size="20">Thermometer between packages</text><text x="315" y="465" text-anchor="middle" fill="black" font-size="18">Wait 5–8 hours for a controlled check</text><rect x="660" y="105" width="450" height="480" rx="24"/><text x="885" y="165" text-anchor="middle" fill="black" font-size="28">Refrigerator</text><text x="885" y="210" text-anchor="middle" fill="black" font-size="22">Target: 40°F or below</text><rect x="790" y="330" width="190" height="100" rx="10"/><text x="885" y="375" text-anchor="middle" fill="black" font-size="20">Glass of water</text><text x="885" y="405" text-anchor="middle" fill="black" font-size="17">thermometer inside</text><text x="885" y="480" text-anchor="middle" fill="black" font-size="18">Place in middle; wait 5–8 hours</text><text x="600" y="640" text-anchor="middle" fill="black" font-size="19">For continuous monitoring, keep thermometers visible and follow appliance instructions.</text><text x="600" y="680" text-anchor="middle" fill="black" font-size="18">Appliance thermometers measure compartments; food thermometers measure food.</text></g></svg>