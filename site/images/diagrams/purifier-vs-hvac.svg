<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t desc">
<title id="t">Portable air cleaner versus HVAC filter</title>
<desc id="desc">The left side shows one-room filtration and the right side shows central recirculation only while the HVAC fan operates.</desc>
<rect width="1200" height="700" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">

<text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Two different airflow paths</text>
<rect x="60" y="110" width="500" height="450" rx="22"/><text x="310" y="160" text-anchor="middle" fill="black" font-size="26">Portable air cleaner</text>
<rect x="220" y="280" width="180" height="110" rx="18"/><text x="310" y="330" text-anchor="middle" fill="black" font-size="22">One room</text><text x="310" y="365" text-anchor="middle" fill="black" font-size="18">local recirculation</text>
<path d="M190 335 Q130 250 210 210" stroke-dasharray="10 8"/><path d="M430 335 Q490 420 410 465" stroke-dasharray="10 8"/>
<text x="310" y="505" text-anchor="middle" fill="black" font-size="18">Size by room and CADR</text>
<rect x="640" y="110" width="500" height="450" rx="22"/><text x="890" y="160" text-anchor="middle" fill="black" font-size="26">HVAC filter</text>
<rect x="740" y="250" width="300" height="170" rx="18"/><text x="890" y="310" text-anchor="middle" fill="black" font-size="22">Return → Filter → Supply</text><text x="890" y="350" text-anchor="middle" fill="black" font-size="18">whole ducted system</text>
<line x1="700" y1="335" x2="740" y2="335"/><line x1="1040" y1="335" x2="1080" y2="335"/>
<text x="890" y="505" text-anchor="middle" fill="black" font-size="18">Filters only while the fan moves air</text>
<text x="600" y="625" text-anchor="middle" fill="black" font-size="18">Neither replaces source control, ventilation or moisture repair.</text>

</g></svg>