<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Frozen food refreezing decision tree</title><desc id="d">A decision tree asks whether ice crystals remain, whether food is 40 degrees Fahrenheit or below, and whether it was warmer than 40 degrees for more than two hours.</desc><rect width="1200" height="800" fill="white"/><g font-family="Arial, sans-serif" stroke="black" stroke-width="3" fill="none"><rect x="390" y="40" width="420" height="80" rx="16"/><text x="600" y="88" text-anchor="middle" fill="black" font-size="26">Frozen food after outage</text><line x1="600" y1="120" x2="600" y2="175"/><rect x="390" y="175" width="420" height="90" rx="16"/><text x="600" y="215" text-anchor="middle" fill="black" font-size="24">Ice crystals remain?</text><text x="600" y="245" text-anchor="middle" fill="black" font-size="18">Check each package</text><line x1="390" y1="220" x2="205" y2="220"/><text x="305" y="205" fill="black" font-size="18">Yes</text><rect x="40" y="175" width="280" height="110" rx="16"/><text x="180" y="220" text-anchor="middle" fill="black" font-size="24">Refreeze or cook</text><text x="180" y="255" text-anchor="middle" fill="black" font-size="17">quality may decline</text><line x1="600" y1="265" x2="600" y2="350"/><text x="620" y="315" fill="black" font-size="18">No</text><rect x="390" y="350" width="420" height="90" rx="16"/><text x="600" y="400" text-anchor="middle" fill="black" font-size="24">Food is 40°F or below?</text><line x1="390" y1="395" x2="205" y2="395"/><text x="305" y="380" fill="black" font-size="18">Yes</text><rect x="40" y="350" width="280" height="110" rx="16"/><text x="180" y="395" text-anchor="middle" fill="black" font-size="24">Refreeze or cook</text><text x="180" y="430" text-anchor="middle" fill="black" font-size="17">quality may decline</text><line x1="810" y1="395" x2="990" y2="395"/><text x="880" y="330" text-anchor="end" fill="black" font-size="18">No / unknown</text><rect x="900" y="350" width="280" height="110" rx="16"/><text x="1040" y="390" text-anchor="middle" fill="black" font-size="22">Above 40°F over 2 hours?</text><text x="1040" y="430" text-anchor="middle" fill="black" font-size="17">or time is unknown?</text><line x1="1040" y1="460" x2="1040" y2="545"/><rect x="900" y="545" width="280" height="100" rx="16"/><text x="1040" y="590" text-anchor="middle" fill="black" font-size="30">Discard</text><text x="1040" y="620" text-anchor="middle" fill="black" font-size="18">Do not taste</text><text x="600" y="710" text-anchor="middle" fill="black" font-size="19">Discard food contaminated by raw meat juices. Discard soft or melted ice cream.</text><text x="600" y="750" text-anchor="middle" fill="black" font-size="18">Normal freezer target: 0°F or below. Refreezing threshold: 40°F or below.</text></g></svg>