<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Microwave input and cooking output power</title><desc id="d">Electrical input powers the microwave system, with part becoming cooking output and part becoming fan, electronics, and heat losses.</desc><rect width="1200" height="620" fill="white"/><g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none"><text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Use electrical input watts for cost</text><rect x="65" y="210" width="260" height="140" rx="18"/><text x="195" y="265" text-anchor="middle" fill="black" font-size="24">Wall input</text><text x="195" y="305" text-anchor="middle" fill="black" font-size="20">electrical watts</text><line x1="325" y1="280" x2="465" y2="280"/><rect x="465" y="155" width="270" height="250" rx="18"/><text x="600" y="225" text-anchor="middle" fill="black" font-size="27">Microwave</text><text x="600" y="275" text-anchor="middle" fill="black" font-size="18">magnetron, fan,</text><text x="600" y="310" text-anchor="middle" fill="black" font-size="18">controls, and losses</text><line x1="735" y1="230" x2="875" y2="180"/><line x1="735" y1="335" x2="875" y2="390"/><rect x="875" y="120" width="260" height="135" rx="18"/><text x="1005" y="175" text-anchor="middle" fill="black" font-size="23">Cooking output</text><text x="1005" y="215" text-anchor="middle" fill="black" font-size="18">advertised watts</text><rect x="875" y="335" width="260" height="135" rx="18"/><text x="1005" y="390" text-anchor="middle" fill="black" font-size="23">Other energy</text><text x="1005" y="430" text-anchor="middle" fill="black" font-size="18">fan, electronics, heat</text><text x="600" y="555" text-anchor="middle" fill="black" font-size="18">Input and cooking-output ratings are not necessarily equal.</text></g></svg>