<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t desc">
<title id="t">Indoor relative humidity target band</title>
<desc id="desc">A horizontal scale marks below 30 percent, the general 30 to 50 percent target, 50 to 60 percent watch range, and above 60 percent investigation range.</desc>
<rect width="1200" height="620" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3">
<text x="600" y="60" text-anchor="middle" fill="black" font-size="32">Indoor relative humidity planning range</text>
<rect x="100" y="190" width="200" height="120" fill="none"/>
<rect x="300" y="190" width="400" height="120" fill="none"/>
<rect x="700" y="190" width="200" height="120" fill="none"/>
<rect x="900" y="190" width="200" height="120" fill="none"/>
<text x="200" y="240" text-anchor="middle" fill="black" font-size="25">Below 30%</text>
<text x="200" y="280" text-anchor="middle" fill="black" font-size="18">Check over-drying</text>
<text x="500" y="240" text-anchor="middle" fill="black" font-size="28">30% to 50%</text>
<text x="500" y="280" text-anchor="middle" fill="black" font-size="18">General target</text>
<text x="800" y="240" text-anchor="middle" fill="black" font-size="25">50% to 60%</text>
<text x="800" y="280" text-anchor="middle" fill="black" font-size="18">Watch conditions</text>
<text x="1000" y="240" text-anchor="middle" fill="black" font-size="25">Above 60%</text>
<text x="1000" y="280" text-anchor="middle" fill="black" font-size="18">Investigate moisture</text>
<line x1="100" y1="350" x2="1100" y2="350"/>
<line x1="300" y1="330" x2="300" y2="370"/><line x1="700" y1="330" x2="700" y2="370"/><line x1="900" y1="330" x2="900" y2="370"/>
<text x="600" y="430" text-anchor="middle" fill="black" font-size="21">Cold-climate heating season may require roughly 30% to 40% to limit window condensation.</text>
<text x="600" y="485" text-anchor="middle" fill="black" font-size="18">Measure several rooms and times. Temperature changes relative humidity.</text>
<text x="600" y="535" text-anchor="middle" fill="black" font-size="18">Persistent high RH is different from a brief shower or cooking spike.</text>
</g></svg>