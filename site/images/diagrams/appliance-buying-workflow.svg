<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t desc">
<title id="t">Appliance purchase and delivery workflow</title>
<desc id="desc">The workflow moves from space and route measurements to hookups, exact model, energy and warranty, recall check, delivery inspection, installation and first-run verification.</desc>
<rect width="1200" height="700" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">

<text x="600" y="45" text-anchor="middle" fill="black" font-size="29">Verify the building before buying the box</text>
<rect x="70" y="100" width="230" height="110" rx="16"/><text x="185" y="145" text-anchor="middle" fill="black" font-size="20">Measure</text><text x="185" y="178" text-anchor="middle" fill="black" font-size="17">space and route</text><rect x="350" y="100" width="230" height="110" rx="16"/><text x="465" y="145" text-anchor="middle" fill="black" font-size="20">Verify</text><text x="465" y="178" text-anchor="middle" fill="black" font-size="17">hookups and vent</text><rect x="630" y="100" width="230" height="110" rx="16"/><text x="745" y="145" text-anchor="middle" fill="black" font-size="20">Choose exact</text><text x="745" y="178" text-anchor="middle" fill="black" font-size="17">model and variant</text><rect x="910" y="100" width="230" height="110" rx="16"/><text x="1025" y="145" text-anchor="middle" fill="black" font-size="20">Read</text><text x="1025" y="178" text-anchor="middle" fill="black" font-size="17">energy and warranty</text><rect x="70" y="270" width="230" height="110" rx="16"/><text x="185" y="315" text-anchor="middle" fill="black" font-size="20">Check</text><text x="185" y="348" text-anchor="middle" fill="black" font-size="17">recall and return</text><rect x="350" y="270" width="230" height="110" rx="16"/><text x="465" y="315" text-anchor="middle" fill="black" font-size="20">Inspect</text><text x="465" y="348" text-anchor="middle" fill="black" font-size="17">delivery condition</text><rect x="630" y="270" width="230" height="110" rx="16"/><text x="745" y="315" text-anchor="middle" fill="black" font-size="20">Confirm</text><text x="745" y="348" text-anchor="middle" fill="black" font-size="17">installation</text><rect x="910" y="270" width="230" height="110" rx="16"/><text x="1025" y="315" text-anchor="middle" fill="black" font-size="20">Verify</text><text x="1025" y="348" text-anchor="middle" fill="black" font-size="17">first run</text>
<text x="600" y="640" text-anchor="middle" fill="black" font-size="18">A product that fits the web page may still fail the doorway, circuit, drain or vent.</text>

</g></svg>