<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t desc">
<title id="t">Ethernet slowest-link chain</title>
<desc id="desc">A chain from device through adapter, cable, switch, router, and internet service shows that overall throughput cannot exceed the slowest relevant link.</desc>
<rect width="1200" height="650" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">
<text x="600" y="60" text-anchor="middle" fill="black" font-size="31">The connection is limited by the slowest relevant link</text>
<rect x="40" y="220" width="150" height="100" rx="14"/><text x="115" y="278" text-anchor="middle" fill="black" font-size="21">Device port</text>
<rect x="230" y="220" width="150" height="100" rx="14"/><text x="305" y="278" text-anchor="middle" fill="black" font-size="21">Adapter</text>
<rect x="420" y="220" width="150" height="100" rx="14"/><text x="495" y="278" text-anchor="middle" fill="black" font-size="21">Cable</text>
<rect x="610" y="220" width="150" height="100" rx="14"/><text x="685" y="278" text-anchor="middle" fill="black" font-size="21">Switch</text>
<rect x="800" y="220" width="150" height="100" rx="14"/><text x="875" y="278" text-anchor="middle" fill="black" font-size="21">Router</text>
<rect x="990" y="220" width="170" height="100" rx="14"/><text x="1075" y="260" text-anchor="middle" fill="black" font-size="20">Internet or</text><text x="1075" y="295" text-anchor="middle" fill="black" font-size="20">remote server</text>
<line x1="190" y1="270" x2="230" y2="270"/><line x1="380" y1="270" x2="420" y2="270"/><line x1="570" y1="270" x2="610" y2="270"/><line x1="760" y1="270" x2="800" y2="270"/><line x1="950" y1="270" x2="990" y2="270"/>
<path d="M420 355 L570 355 L570 435 L420 435 Z" stroke-width="5"/>
<text x="495" y="398" text-anchor="middle" fill="black" font-size="20">Example bottleneck</text>
<line x1="495" y1="320" x2="495" y2="355"/>
<text x="600" y="505" text-anchor="middle" fill="black" font-size="20">A faster cable cannot upgrade a slower port, adapter, switch, plan, or server.</text>
<text x="600" y="555" text-anchor="middle" fill="black" font-size="18">Link rate is not the same as application throughput.</text>
</g></svg>