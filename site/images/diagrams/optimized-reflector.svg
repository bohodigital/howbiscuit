<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Optimized reflector and random foil comparison</title><desc id="d">A modeled reflector directs coverage toward a target area, while random foil creates uncontrolled changes and may obstruct the router.</desc><rect width="1200" height="680" fill="white"/><g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none"><text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Optimized research reflector is not random foil</text><rect x="60" y="105" width="500" height="450" rx="20"/><text x="310" y="155" text-anchor="middle" fill="black" font-size="25">Modeled reflector</text><path d="M185 255 Q110 335 185 425" stroke-width="10"/><rect x="230" y="300" width="120" height="80" rx="10"/><text x="290" y="347" text-anchor="middle" fill="black" font-size="19">Access point</text><path d="M350 340 Q455 250 530 205" stroke-dasharray="10 8"/><path d="M350 340 Q470 340 535 340" stroke-dasharray="10 8"/><path d="M350 340 Q455 430 530 475" stroke-dasharray="10 8"/><text x="400" y="190" text-anchor="middle" fill="black" font-size="18">target region</text><rect x="640" y="105" width="500" height="450" rx="20"/><text x="890" y="155" text-anchor="middle" fill="black" font-size="25">Random foil</text><path d="M790 245 L745 295 L800 335 L750 395 L810 445" stroke-width="10"/><rect x="835" y="300" width="120" height="80" rx="10"/><text x="895" y="347" text-anchor="middle" fill="black" font-size="19">Router</text><path d="M955 340 Q1050 260 1120 225" stroke-dasharray="7 10"/><path d="M955 340 Q1050 375 1120 430" stroke-dasharray="7 10"/><text x="1015" y="190" text-anchor="middle" fill="black" font-size="18">unknown result</text><text x="600" y="610" text-anchor="middle" fill="black" font-size="18">Never wrap equipment, cover vents, or let foil touch ports, antennas, or power.</text></g></svg>