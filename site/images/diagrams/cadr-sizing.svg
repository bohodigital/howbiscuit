<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t desc">
<title id="t">Portable air-cleaner CADR sizing</title>
<desc id="desc">A table-style diagram maps 100 to 600 square feet to EPA minimum CADR values at an eight-foot ceiling.</desc>
<rect width="1200" height="700" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">

<text x="600" y="55" text-anchor="middle" fill="black" font-size="30">EPA estimation table - 8-foot ceiling</text>
<rect x="140" y="120" width="920" height="390"/>
<line x1="140" y1="190" x2="1060" y2="190"/>
<text x="270" y="165" text-anchor="middle" fill="black" font-size="22">Room area</text><text x="740" y="165" text-anchor="middle" fill="black" font-size="22">Minimum CADR</text>
<line x1="140" y1="190" x2="1060" y2="190"/><text x="270" y="225" text-anchor="middle" fill="black" font-size="20">100 sq ft</text><text x="740" y="225" text-anchor="middle" fill="black" font-size="20">65 cfm</text><line x1="140" y1="243" x2="1060" y2="243"/><text x="270" y="278" text-anchor="middle" fill="black" font-size="20">200 sq ft</text><text x="740" y="278" text-anchor="middle" fill="black" font-size="20">130 cfm</text><line x1="140" y1="296" x2="1060" y2="296"/><text x="270" y="331" text-anchor="middle" fill="black" font-size="20">300 sq ft</text><text x="740" y="331" text-anchor="middle" fill="black" font-size="20">195 cfm</text><line x1="140" y1="349" x2="1060" y2="349"/><text x="270" y="384" text-anchor="middle" fill="black" font-size="20">400 sq ft</text><text x="740" y="384" text-anchor="middle" fill="black" font-size="20">260 cfm</text><line x1="140" y1="402" x2="1060" y2="402"/><text x="270" y="437" text-anchor="middle" fill="black" font-size="20">500 sq ft</text><text x="740" y="437" text-anchor="middle" fill="black" font-size="20">325 cfm</text><line x1="140" y1="455" x2="1060" y2="455"/><text x="270" y="490" text-anchor="middle" fill="black" font-size="20">600 sq ft</text><text x="740" y="490" text-anchor="middle" fill="black" font-size="20">390 cfm</text>
<line x1="480" y1="120" x2="480" y2="510"/>
<text x="600" y="575" text-anchor="middle" fill="black" font-size="18">Higher ceilings and connected rooms generally need more capacity.</text>
<text x="600" y="615" text-anchor="middle" fill="black" font-size="18">Use smoke CADR when fine-particle removal is the goal.</text>

</g></svg>