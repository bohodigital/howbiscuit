<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Room-by-room Wi-Fi test grid</title>
<desc id="d">A simplified nine-room plan shows a router and numbered test locations for a repeatable dead-zone survey.</desc>
<rect width="1200" height="700" fill="white"/>
<g font-family="Arial, sans-serif" stroke="black" stroke-width="3" fill="none">
<text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Room-by-room dead-zone test</text>
<rect x="180" y="90" width="840" height="510"/>
<line x1="460" y1="90" x2="460" y2="600"/><line x1="740" y1="90" x2="740" y2="600"/>
<line x1="180" y1="260" x2="1020" y2="260"/><line x1="180" y1="430" x2="1020" y2="430"/>
<rect x="555" y="300" width="90" height="70" rx="8"/><text x="600" y="342" text-anchor="middle" fill="black" font-size="18">Router</text>
<circle cx="320" cy="175" r="30"/><text x="320" y="183" text-anchor="middle" fill="black" font-size="24">1</text><circle cx="600" cy="175" r="30"/><text x="600" y="183" text-anchor="middle" fill="black" font-size="24">2</text><circle cx="880" cy="175" r="30"/><text x="880" y="183" text-anchor="middle" fill="black" font-size="24">3</text><circle cx="320" cy="345" r="30"/><text x="320" y="353" text-anchor="middle" fill="black" font-size="24">4</text><circle cx="880" cy="345" r="30"/><text x="880" y="353" text-anchor="middle" fill="black" font-size="24">5</text><circle cx="320" cy="515" r="30"/><text x="320" y="523" text-anchor="middle" fill="black" font-size="24">6</text><circle cx="600" cy="515" r="30"/><text x="600" y="523" text-anchor="middle" fill="black" font-size="24">7</text><circle cx="880" cy="515" r="30"/><text x="880" y="523" text-anchor="middle" fill="black" font-size="24">8</text>
<text x="600" y="640" text-anchor="middle" fill="black" font-size="19">Use the same device and test method at every numbered point.</text>
<text x="600" y="675" text-anchor="middle" fill="black" font-size="17">Record band, download, upload, latency, disconnects, and obstacles.</text>
</g></svg>