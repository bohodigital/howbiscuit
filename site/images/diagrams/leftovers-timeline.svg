<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t desc">
<title id="t">Leftover cooling and refrigerator timeline</title>
<desc id="desc">The timeline shows refrigerating within two hours, using most cooked leftovers within three to four days, and reheating to 165 degrees Fahrenheit.</desc>
<rect width="1200" height="700" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">

<text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Leftover safety timeline</text>
<line x1="120" y1="340" x2="1080" y2="340" stroke-width="6"/>
<circle cx="180" cy="340" r="24"/><text x="180" y="280" text-anchor="middle" fill="black" font-size="20">Meal ends</text>
<circle cx="390" cy="340" r="24"/><text x="390" y="270" text-anchor="middle" fill="black" font-size="20">Refrigerate</text><text x="390" y="300" text-anchor="middle" fill="black" font-size="18">within 2 hours</text>
<circle cx="690" cy="340" r="24"/><text x="690" y="270" text-anchor="middle" fill="black" font-size="20">Days 1-3</text><text x="690" y="300" text-anchor="middle" fill="black" font-size="18">use or freeze</text>
<circle cx="950" cy="340" r="24"/><text x="950" y="270" text-anchor="middle" fill="black" font-size="20">Day 4</text><text x="950" y="300" text-anchor="middle" fill="black" font-size="18">general limit</text>
<rect x="390" y="420" width="560" height="100" rx="18"/><text x="670" y="460" text-anchor="middle" fill="black" font-size="21">Refrigerator at 40°F or below</text><text x="670" y="495" text-anchor="middle" fill="black" font-size="19">Reheat leftovers to 165°F</text>
<text x="600" y="610" text-anchor="middle" fill="black" font-size="18">Use a 1-hour room-temperature limit above 90°F.</text>

</g></svg>