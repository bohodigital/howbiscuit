<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t desc">
<title id="t">Refrigerator and freezer airflow</title>
<desc id="desc">Cold air produced near the freezer evaporator is moved by a fan through a damper into the refrigerator, then returns through a separate path.</desc>
<rect width="1200" height="700" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">

<text x="600" y="55" text-anchor="middle" fill="black" font-size="30">A cold freezer still needs airflow to cool the refrigerator</text>
<rect x="100" y="130" width="420" height="430" rx="18"/><text x="310" y="180" text-anchor="middle" fill="black" font-size="26">Freezer</text>
<rect x="205" y="260" width="210" height="120" rx="16"/><text x="310" y="310" text-anchor="middle" fill="black" font-size="21">Evaporator</text><text x="310" y="345" text-anchor="middle" fill="black" font-size="21">and fan</text>
<rect x="680" y="130" width="420" height="430" rx="18"/><text x="890" y="180" text-anchor="middle" fill="black" font-size="26">Refrigerator</text>
<rect x="555" y="250" width="90" height="100" rx="12"/><text x="600" y="307" text-anchor="middle" fill="black" font-size="18">Damper</text>
<line x1="415" y1="300" x2="555" y2="300"/><line x1="645" y1="300" x2="780" y2="300"/>
<path d="M780 430 Q600 530 420 430" stroke-dasharray="10 8"/>
<text x="600" y="470" text-anchor="middle" fill="black" font-size="18">Return-air path</text>
<text x="600" y="625" text-anchor="middle" fill="black" font-size="18">Blocked vents, frost, fan or damper faults can warm the refrigerator side.</text>

</g></svg>