<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="t desc">
<title id="t">Router replacement decision tree</title>
<desc id="desc">The tree checks support status, security, persistent failures, and actual capability needs before considering router age.</desc>
<rect width="1200" height="790" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">
<rect x="375" y="35" width="450" height="75" rx="16"/><text x="600" y="80" text-anchor="middle" fill="black" font-size="26">Should the router be replaced?</text>
<line x1="600" y1="110" x2="600" y2="155"/>
<rect x="375" y="155" width="450" height="85" rx="16"/><text x="600" y="190" text-anchor="middle" fill="black" font-size="23">Does it still receive security updates?</text><text x="600" y="220" text-anchor="middle" fill="black" font-size="17">Verify exact model and hardware version</text>
<line x1="375" y1="198" x2="210" y2="198"/><text x="300" y="182" fill="black" font-size="18">No</text>
<rect x="35" y="150" width="280" height="105" rx="16"/><text x="175" y="192" text-anchor="middle" fill="black" font-size="24">Strong replacement reason</text><text x="175" y="225" text-anchor="middle" fill="black" font-size="17">especially with obsolete security</text>
<line x1="600" y1="240" x2="600" y2="300"/><text x="620" y="275" fill="black" font-size="18">Yes</text>
<rect x="375" y="300" width="450" height="85" rx="16"/><text x="600" y="338" text-anchor="middle" fill="black" font-size="23">Persistent network-wide failures?</text><text x="600" y="367" text-anchor="middle" fill="black" font-size="17">after supported checks</text>
<line x1="825" y1="342" x2="990" y2="342"/><text x="885" y="325" fill="black" font-size="18">Yes</text>
<rect x="900" y="295" width="280" height="105" rx="16"/><text x="1040" y="337" text-anchor="middle" fill="black" font-size="23">Repair, exchange,</text><text x="1040" y="370" text-anchor="middle" fill="black" font-size="23">or replace may be justified</text>
<line x1="600" y1="385" x2="600" y2="445"/><text x="620" y="420" fill="black" font-size="18">No</text>
<rect x="375" y="445" width="450" height="90" rx="16"/><text x="600" y="482" text-anchor="middle" fill="black" font-size="22">Actual port, coverage, or compatibility need?</text><text x="600" y="512" text-anchor="middle" fill="black" font-size="17">not merely a newer standard</text>
<line x1="375" y1="490" x2="210" y2="490"/><text x="300" y="474" fill="black" font-size="18">Yes</text>
<rect x="35" y="440" width="280" height="105" rx="16"/><text x="175" y="482" text-anchor="middle" fill="black" font-size="23">Compare replacement</text><text x="175" y="515" text-anchor="middle" fill="black" font-size="18">or network redesign</text>
<line x1="600" y1="535" x2="600" y2="600"/><text x="620" y="573" fill="black" font-size="18">No</text>
<rect x="375" y="600" width="450" height="90" rx="16"/><text x="600" y="640" text-anchor="middle" fill="black" font-size="25">Keep using and maintain it</text><text x="600" y="672" text-anchor="middle" fill="black" font-size="17">Age alone is not the decision</text>
<text x="600" y="750" text-anchor="middle" fill="black" font-size="18">Check ISP-managed equipment, approved power supply, firmware, and privacy before disposal.</text>
</g></svg>