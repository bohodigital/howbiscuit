<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t desc">
<title id="t">EnergyGuide and ENERGY STAR comparison</title>
<desc id="desc">EnergyGuide provides standardized energy information while ENERGY STAR identifies products meeting voluntary efficiency criteria.</desc>
<rect width="1200" height="700" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">

<text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Disclosure label versus efficiency certification</text>
<rect x="80" y="130" width="470" height="400" rx="22"/><text x="315" y="185" text-anchor="middle" fill="black" font-size="28">EnergyGuide</text>
<text x="315" y="260" text-anchor="middle" fill="black" font-size="21">Annual energy use</text><text x="315" y="310" text-anchor="middle" fill="black" font-size="21">Estimated operating cost</text><text x="315" y="360" text-anchor="middle" fill="black" font-size="21">Similar-model range</text><text x="315" y="410" text-anchor="middle" fill="black" font-size="21">Covered products</text>
<rect x="650" y="130" width="470" height="400" rx="22"/><text x="885" y="185" text-anchor="middle" fill="black" font-size="28">ENERGY STAR</text>
<text x="885" y="260" text-anchor="middle" fill="black" font-size="21">Voluntary certification</text><text x="885" y="310" text-anchor="middle" fill="black" font-size="21">Current efficiency criteria</text><text x="885" y="360" text-anchor="middle" fill="black" font-size="21">Eligible categories</text><text x="885" y="410" text-anchor="middle" fill="black" font-size="21">Model-specific status</text>
<text x="600" y="620" text-anchor="middle" fill="black" font-size="18">Use both with capacity, fit, installation, warranty and local energy rates.</text>

</g></svg>