<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">Convert annual appliance kilowatt-hours to cost</title>
<desc id="d">A three-step diagram multiplies annual kilowatt-hours by a local electricity rate, then divides annual cost by twelve for a monthly average.</desc>
<rect width="1200" height="650" fill="white"/>
<g font-family="Arial, sans-serif" stroke="black" stroke-width="3" fill="none">
<text x="600" y="55" text-anchor="middle" fill="black" font-size="31">Use annual kWh with your own electricity rate</text>
<rect x="60" y="150" width="290" height="240" rx="22"/>
<text x="205" y="205" text-anchor="middle" fill="black" font-size="24">EnergyGuide</text>
<text x="205" y="250" text-anchor="middle" fill="black" font-size="42">400 kWh/year</text>
<text x="205" y="305" text-anchor="middle" fill="black" font-size="18">Hypothetical model</text>
<line x1="350" y1="270" x2="460" y2="270"/><text x="405" y="245" text-anchor="middle" fill="black" font-size="28">x</text>
<rect x="460" y="150" width="280" height="240" rx="22"/>
<text x="600" y="205" text-anchor="middle" fill="black" font-size="24">Example rate</text>
<text x="600" y="250" text-anchor="middle" fill="black" font-size="42">$0.1844/kWh</text>
<text x="600" y="305" text-anchor="middle" fill="black" font-size="18">May 2026 U.S. average</text>
<line x1="740" y1="270" x2="850" y2="270"/><text x="795" y="245" text-anchor="middle" fill="black" font-size="28">=</text>
<rect x="850" y="150" width="290" height="240" rx="22"/>
<text x="995" y="205" text-anchor="middle" fill="black" font-size="24">Estimated annual cost</text>
<text x="995" y="250" text-anchor="middle" fill="black" font-size="42">$73.76/year</text>
<text x="995" y="305" text-anchor="middle" fill="black" font-size="24">$6.15/month average</text>
<text x="600" y="465" text-anchor="middle" fill="black" font-size="21">Your cost depends on your model, usage, and local variable electricity price.</text>
<text x="600" y="515" text-anchor="middle" fill="black" font-size="19">Fixed monthly utility charges do not disappear when appliance energy use changes.</text>
</g></svg>