<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t desc">
<title id="t">Dehumidifier and air conditioner heat and moisture paths</title>
<desc id="desc">The left side shows a portable dehumidifier removing moisture and returning warmer dry air indoors. The right side shows an air conditioner removing moisture and sending heat outdoors.</desc>
<rect width="1200" height="720" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">
<text x="600" y="55" text-anchor="middle" fill="black" font-size="31">Both condense moisture; only the AC moves heat outdoors</text>
<rect x="55" y="105" width="505" height="500" rx="22"/>
<text x="308" y="155" text-anchor="middle" fill="black" font-size="28">Portable dehumidifier</text>
<rect x="205" y="255" width="205" height="150" rx="18"/><text x="308" y="325" text-anchor="middle" fill="black" font-size="23">Moisture condensed</text><text x="308" y="365" text-anchor="middle" fill="black" font-size="20">Water collected</text>
<path d="M100 330 L205 330" /><text x="150" y="305" text-anchor="middle" fill="black" font-size="17">humid room air</text>
<path d="M410 330 L520 330" /><text x="465" y="305" text-anchor="middle" fill="black" font-size="17">warmer dry air</text>
<text x="308" y="475" text-anchor="middle" fill="black" font-size="19">Heat stays in the room</text>
<text x="308" y="520" text-anchor="middle" fill="black" font-size="17">Primary job: moisture removal</text>
<rect x="640" y="105" width="505" height="500" rx="22"/>
<text x="893" y="155" text-anchor="middle" fill="black" font-size="28">Air conditioner</text>
<rect x="700" y="255" width="205" height="150" rx="18"/><text x="803" y="315" text-anchor="middle" fill="black" font-size="23">Indoor coil</text><text x="803" y="355" text-anchor="middle" fill="black" font-size="19">Heat and moisture removed</text>
<rect x="970" y="255" width="125" height="150" rx="18"/><text x="1033" y="315" text-anchor="middle" fill="black" font-size="21">Outdoor</text><text x="1033" y="350" text-anchor="middle" fill="black" font-size="21">condenser</text>
<line x1="905" y1="330" x2="970" y2="330"/><text x="938" y="307" text-anchor="middle" fill="black" font-size="16">heat out</text>
<path d="M665 330 L700 330"/><path d="M700 435 L665 435"/><text x="690" y="465" text-anchor="middle" fill="black" font-size="17">cooler dry air indoors</text>
<text x="893" y="520" text-anchor="middle" fill="black" font-size="17">Primary job: cooling, with moisture removal</text>
<text x="600" y="660" text-anchor="middle" fill="black" font-size="18">Fix water sources first. Running both can increase total electricity use.</text>
</g></svg>