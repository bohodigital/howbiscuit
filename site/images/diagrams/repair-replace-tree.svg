<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t desc">
<title id="t">Appliance repair or replacement decision</title>
<desc id="desc">A decision tree checks safety, recall, warranty, diagnosis, support and total cost before choosing repair or replacement.</desc>
<rect width="1200" height="700" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">

<text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Safety comes before percentage rules</text>
<rect x="400" y="100" width="400" height="75" rx="16"/><text x="600" y="145" text-anchor="middle" fill="black" font-size="24">Active safety problem or recall?</text>
<line x1="400" y1="138" x2="230" y2="138"/><text x="315" y="122" fill="black" font-size="18">Yes</text>
<rect x="40" y="95" width="280" height="95" rx="16"/><text x="180" y="135" text-anchor="middle" fill="black" font-size="22">Stop use and follow</text><text x="180" y="168" text-anchor="middle" fill="black" font-size="22">recall or safety process</text>
<line x1="600" y1="175" x2="600" y2="240"/><text x="620" y="212" fill="black" font-size="18">No</text>
<rect x="400" y="240" width="400" height="75" rx="16"/><text x="600" y="285" text-anchor="middle" fill="black" font-size="24">Warranty or service contract?</text>
<line x1="600" y1="315" x2="600" y2="375"/>
<rect x="400" y="375" width="400" height="85" rx="16"/><text x="600" y="412" text-anchor="middle" fill="black" font-size="23">Reliable diagnosis and supported parts?</text><text x="600" y="443" text-anchor="middle" fill="black" font-size="17">Include labor and repeat-failure risk</text>
<line x1="400" y1="418" x2="230" y2="418"/><text x="315" y="400" fill="black" font-size="18">Yes</text>
<rect x="40" y="370" width="280" height="100" rx="16"/><text x="180" y="413" text-anchor="middle" fill="black" font-size="25">Repair may fit</text><text x="180" y="448" text-anchor="middle" fill="black" font-size="17">compare full estimate</text>
<line x1="800" y1="418" x2="970" y2="418"/><text x="870" y="400" fill="black" font-size="18">No</text>
<rect x="880" y="370" width="280" height="100" rx="16"/><text x="1020" y="413" text-anchor="middle" fill="black" font-size="25">Replace may fit</text><text x="1020" y="448" text-anchor="middle" fill="black" font-size="17">include installation and disposal</text>
<text x="600" y="590" text-anchor="middle" fill="black" font-size="18">Age and a “50% rule” are not enough by themselves.</text>

</g></svg>