<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Power outage refrigerator and freezer time limits</title><desc id="d">About four hours for an unopened refrigerator, 48 hours for a full unopened freezer, and 24 hours for a half-full unopened freezer.</desc><rect width="1200" height="700" fill="white"/><g font-family="Arial, sans-serif" stroke="black" stroke-width="3" fill="none"><text x="600" y="60" text-anchor="middle" fill="black" font-size="32">Keep the doors closed</text><rect x="80" y="130" width="300" height="360" rx="24"/><text x="230" y="205" text-anchor="middle" fill="black" font-size="28">Refrigerator</text><text x="230" y="345" text-anchor="middle" fill="black" font-size="64">4</text><text x="230" y="390" text-anchor="middle" fill="black" font-size="28">hours</text><text x="230" y="435" text-anchor="middle" fill="black" font-size="18">about, if unopened</text><rect x="450" y="130" width="300" height="360" rx="24"/><text x="600" y="205" text-anchor="middle" fill="black" font-size="28">Full freezer</text><text x="600" y="345" text-anchor="middle" fill="black" font-size="64">48</text><text x="600" y="390" text-anchor="middle" fill="black" font-size="28">hours</text><text x="600" y="435" text-anchor="middle" fill="black" font-size="18">about, if unopened</text><rect x="820" y="130" width="300" height="360" rx="24"/><text x="970" y="205" text-anchor="middle" fill="black" font-size="28">Half-full freezer</text><text x="970" y="345" text-anchor="middle" fill="black" font-size="64">24</text><text x="970" y="390" text-anchor="middle" fill="black" font-size="28">hours</text><text x="970" y="435" text-anchor="middle" fill="black" font-size="18">about, if unopened</text><text x="600" y="555" text-anchor="middle" fill="black" font-size="22">Refrigerator target: 40°F or below. Freezer target: 0°F or below.</text><text x="600" y="610" text-anchor="middle" fill="black" font-size="19">Planning estimates assume the appliances started cold and doors remained closed.</text><text x="600" y="650" text-anchor="middle" fill="black" font-size="22">Never taste food to decide whether it is safe.</text></g></svg>