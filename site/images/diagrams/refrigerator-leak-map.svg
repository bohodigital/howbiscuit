<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t desc">
<title id="t">Refrigerator external leak-source map</title>
<desc id="desc">A refrigerator outline identifies supply line, filter, ice maker, defrost drain, drain pan, door seal and nearby plumbing as visible leak directions.</desc>
<rect width="1200" height="700" fill="white"/>
<g font-family="Arial,sans-serif" stroke="black" stroke-width="3" fill="none">

<text x="600" y="55" text-anchor="middle" fill="black" font-size="30">Trace the first wet point</text>
<rect x="430" y="110" width="340" height="470" rx="20"/><line x1="430" y1="330" x2="770" y2="330"/>
<text x="600" y="180" text-anchor="middle" fill="black" font-size="24">Freezer / ice maker</text><text x="600" y="430" text-anchor="middle" fill="black" font-size="24">Refrigerator</text>
<line x1="300" y1="170" x2="430" y2="170"/><text x="200" y="177" text-anchor="middle" fill="black" font-size="18">Supply line / valve</text>
<line x1="770" y1="220" x2="910" y2="220"/><text x="1000" y="227" text-anchor="middle" fill="black" font-size="18">Filter / ice fill</text>
<line x1="300" y1="390" x2="430" y2="390"/><text x="205" y="397" text-anchor="middle" fill="black" font-size="18">Defrost drain</text>
<line x1="770" y1="460" x2="910" y2="460"/><text x="1000" y="467" text-anchor="middle" fill="black" font-size="18">Door seal / condensation</text>
<line x1="600" y1="580" x2="600" y2="640"/><text x="600" y="675" text-anchor="middle" fill="black" font-size="18">Drain pan, floor or nearby plumbing</text>

</g></svg>